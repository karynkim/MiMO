@property --mx{syntax:'<percentage>';inherits:true;initial-value:50%}

.volpop .slider input[type=range]{height:44px}
.volpop .slider input[type=range]::-webkit-slider-runnable-track{height:14px;background:radial-gradient(circle,var(--border-strong) 2.6px,transparent 3.2px) 25% 50%/14px 14px no-repeat,radial-gradient(circle,var(--border-strong) 2.6px,transparent 3.2px) 50% 50%/14px 14px no-repeat,radial-gradient(circle,var(--border-strong) 2.6px,transparent 3.2px) 75% 50%/14px 14px no-repeat,linear-gradient(var(--border-strong),var(--border-strong)) 0 50%/100% 2px no-repeat}
.volpop .slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-8px;border-radius:50%;background:var(--text-primary);border:0;box-shadow:none;transition:box-shadow .15s,transform .15s}
.volpop .slider input[type=range].drag::-webkit-slider-thumb{box-shadow:0 0 0 9px rgba(255,123,57,.35);transform:scale(.62)}

/* ---------- 오늘의 드라이브 추천: 크기 다른 원 ---------- */
.dstrip{--D:300px;--g:6px;display:flex;gap:var(--g);overflow-x:auto;overflow-y:hidden;padding:4px 32px 10px 2px;margin-right:-32px;scrollbar-width:none;scroll-snap-type:x proximity;overscroll-behavior-x:contain;cursor:grab;-webkit-overflow-scrolling:touch}
.dstrip.drag{cursor:grabbing;scroll-snap-type:none}.dstrip.drag .dcirc{pointer-events:none}
.dstrip::-webkit-scrollbar{display:none}
.rear .dstrip{--D:220px;--g:5px;padding-right:20px;margin-right:-20px}
.dgrp{flex:none;scroll-snap-align:start}
.dgrp.big{width:var(--D);height:var(--D)}
.dgrp.pair{display:grid;grid-template-rows:1fr 1fr;gap:var(--g);height:var(--D);width:calc((var(--D) - var(--g)) / 2)}
.dgrp.pair.one{grid-template-rows:1fr;align-content:center}.dgrp.pair.one .dcirc{height:auto}
.dhot{margin-top:10px;white-space:nowrap;padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:13px;letter-spacing:.02em;pointer-events:none}
.dcirc{position:relative;display:block;width:100%;height:100%;aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;background-size:cover;background-position:center;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-radius .35s}
.dcirc:active{transform:scale(.97)}
.dcirc:focus-visible{outline:3px solid var(--accent-primary);outline-offset:4px}
.dcap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:0 16% 14%;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 60%);opacity:0;transition:opacity .25s}
.dcirc.big .dcap{opacity:1}.dcirc:hover .dcap,.dcirc:focus-visible .dcap{opacity:1}
.dcap b{font-weight:600;font-size:19px;line-height:24px}.dcap small{font-size:13px;opacity:.85}
.dcirc.sm .dcap b{font-size:14px;line-height:18px}.dcirc.sm .dcap small{display:none}
.dzveil{position:absolute;inset:0;z-index:60;background:var(--bg-canvas);opacity:0;pointer-events:none}
.dzoom{position:absolute;z-index:61;background-size:cover;background-position:center;box-shadow:0 30px 80px rgba(0,0,0,.25);pointer-events:none}
.dzinfo{position:absolute;z-index:61;opacity:0;pointer-events:none;color:var(--text-primary);display:grid;gap:10px;max-width:520px}
.dzinfo .t-mono{color:var(--accent-primary);letter-spacing:.14em}
.dzinfo .dzt{font-family:var(--f-title);font-size:56px;line-height:62px;font-weight:500;letter-spacing:-.02em}
.dzinfo .dza{font-size:20px;color:var(--text-secondary)}

/* OTT 앱 타일 + 인앱 창 */
.apptile.ott{color:#fff}.apptile.ott svg{width:84px;height:84px}
.apptile.ott.youtube{background:#FF0000}.apptile.ott.netflix{background:#1A1A1A;color:#E50914}
.apptile.ott.disney{background:linear-gradient(160deg,#0E1A4F,#1F5BC5)}.apptile.ott.tving{background:#FF153C}
.apptile.ott img{width:100%;height:100%;object-fit:cover}.apptile.ott.watcha{background:#000}
.apptile.ott.xs{width:56px;height:56px;border-radius:16px;transform:none}.apptile.ott.xs svg{width:30px;height:30px}
.rear .apptile.ott svg{width:64px;height:64px}
.appwin{position:absolute;inset:28px 32px 28px 168px;z-index:45;display:flex;flex-direction:column;border-radius:var(--radius-xl);background:var(--bg-canvas);box-shadow:0 30px 90px rgba(0,0,0,.35),0 0 0 1px color-mix(in srgb,var(--text-primary) 8%,transparent);overflow:hidden}
.rear .appwin{inset:16px 20px 16px 132px}
.awbar{display:flex;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid color-mix(in srgb,var(--text-primary) 8%,transparent)}
.appwin.youtube .awbar{box-shadow:inset 0 -3px 0 #FF0000}.appwin.netflix .awbar{box-shadow:inset 0 -3px 0 #E50914}.appwin.disney .awbar{box-shadow:inset 0 -3px 0 #1F5BC5}.appwin.tving .awbar{box-shadow:inset 0 -3px 0 #FF153C}
.awbody{flex:1;min-height:0;padding:28px 32px 40px;display:flex;flex-direction:column;gap:22px}
.awhero{position:relative;flex:0 0 auto;height:360px;border-radius:var(--radius-lg);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:32px;color:#fff;overflow:hidden}
.awhero::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),transparent 60%)}.awhero>div{position:relative;display:grid;gap:12px;justify-items:start}
.awempty{margin:auto;display:grid;justify-items:center;gap:14px;text-align:center;max-width:620px;word-break:keep-all}.awempty svg{width:64px;height:64px;opacity:.5}

/* 홈 스크롤 영역을 화면 오른쪽 끝까지 넓혀 가로 띠가 프레임 끝에서 잘려 보이게(더 있다는 신호), 가로 스크롤바는 없앰 */
#main .scroll{overflow-x:hidden;scrollbar-width:none}
#main .scroll::-webkit-scrollbar{display:none}
#device{--bleed:60px}#device.rear{--bleed:36px}
#main > .scroll:not(.panel){margin-right:calc(-1 * var(--bleed));padding-right:var(--bleed)}
#main .dstrip{margin-right:calc(-1 * var(--bleed));padding-right:var(--bleed)}

/* mimo 꾸미기 */
.decoprev{width:560px;flex:0 0 auto;align-items:center;gap:20px}.rear .decoprev{width:380px;gap:12px;overflow:hidden}.rear .decoside{min-height:120px}
.decoside{position:relative;width:100%;flex:1;min-height:220px;border-radius:var(--radius-lg);background:#FFFFFF;overflow:hidden}
.decotiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.decotile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px;border:0;border-radius:var(--radius-lg);background:var(--bg-canvas);color:var(--text-primary);cursor:pointer;font:inherit}
.decotile[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--text-primary)}
.decodraw{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;border:2px dashed color-mix(in srgb,var(--text-primary) 25%,transparent)}.decodraw svg{width:48px;height:48px;opacity:.7}
.rear .decodraw{width:120px;height:120px}

/* 스크롤되는 목록은 벤토 박스(패널)에 넣지 않음: 패널 배경을 지워 화면 위에 바로 놓이게 → 스크롤 가능함이 보이게 */
#main .panel.scroll,#main .panel:has(> .scroll),#main .panel:has(> div > .scroll){background:transparent !important;box-shadow:none !important;border-radius:0;padding-left:0;padding-right:0}

/* 파란 그라데이션 슬라이더 연결선 제거 */
.glowsvg{display:none!important}

/* 비비드 그라데이션 · 스위스 모더니즘: 큰 숫자, 큰 아이콘, 유리 광택 */
.v0{--vg:radial-gradient(90% 70% at 85% 5%,#ff1d6c 0%,transparent 60%),radial-gradient(80% 60% at 10% 100%,#ffe27a 0%,transparent 65%),linear-gradient(160deg,#ee7af2,#ff70a6 55%,#ffc46b)}
.v1{--vg:radial-gradient(70% 70% at 30% 20%,#ffd23a,transparent 70%),linear-gradient(150deg,#ffa41b,#ff4e1f)}
.v2{--vg:radial-gradient(80% 70% at 30% 20%,#b07bff,transparent 70%),linear-gradient(150deg,#7a2dff,#e46cff)}
.v3{--vg:radial-gradient(70% 90% at 90% 50%,#f6f26a,transparent 60%),linear-gradient(120deg,#1f7a34,#7fd65b 60%,#e9ef6a)}
.v4{--vg:radial-gradient(90% 60% at 50% 0%,#7fe0ff,transparent 70%),linear-gradient(175deg,#4fb6ff,#2363d1 55%,#0d2650)}
.v5{--vg:radial-gradient(80% 70% at 70% 20%,#ffb2f4,transparent 70%),linear-gradient(150deg,#ff3fd2,#ff8fe9)}
.vtile{position:relative;border:0;cursor:pointer;text-align:left;color:#fff;font:inherit;border-radius:32px;padding:26px 26px 22px;background:var(--vg,#2E2E2E);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;overflow:hidden;aspect-ratio:1;
 box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -18px 40px rgba(0,0,0,.14),0 16px 40px -18px rgba(0,0,0,.35);transition:transform .15s}
.vtile::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 38%);pointer-events:none}

.vbento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.vbento .vtile.wide{grid-column:span 2;aspect-ratio:auto}
.vt-ov{opacity:.85;letter-spacing:.14em;font-size:13px;position:relative}
.vt-num{position:relative;font-family:var(--f-num);font-weight:300;font-size:150px;line-height:.82;letter-spacing:-.06em;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 30px rgba(255,255,255,.45)}
.vbento .wide .vt-num{font-size:190px}
.vt-num.big{font-size:260px}
.vt-foot{position:relative;display:flex;align-items:flex-end;justify-content:space-between;width:100%;gap:12px}
.vt-name{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.vt-sub{display:block;font-size:15px;opacity:.85;margin-top:4px}
.vt-go{flex:0 0 auto;width:60px;height:60px;border-radius:50%;background:#fff;color:#1A1A1A;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.vt-go svg{width:28px;height:28px}
.vnew{--vg:linear-gradient(150deg,#2a2a2e,#141416);justify-content:center;align-items:center;gap:16px;text-align:center}
.vt-plus{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.12) 60%);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 0 40px rgba(255,140,90,.35);color:#fff}
.vt-plus svg{width:56px;height:56px}
.vhero{aspect-ratio:auto;cursor:default;padding:30px;gap:18px}
.vh-mid{position:relative;display:flex;align-items:flex-end;gap:14px;margin:auto 0 0}
.vh-unit{font-size:30px;font-weight:600;line-height:1.1;padding-bottom:22px}.vh-unit small{font-size:17px;font-weight:400;opacity:.85}
.vh-name{position:relative;font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.vpill{position:relative;flex:1;height:76px;border:0;border-radius:999px;padding:0 10px 0 30px;display:flex;align-items:center;justify-content:space-between;font:inherit;font-size:20px;font-weight:600;color:#fff;cursor:pointer;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
.vpill:disabled{opacity:.5}
.vglass{position:relative;width:76px;height:76px;border:0;border-radius:50%;display:grid;place-items:center;color:#fff;cursor:pointer;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
.vglass.sm{width:52px;height:52px}.vglass svg{width:28px;height:28px}
.vrow{display:flex;align-items:center;gap:6px;border-radius:24px;padding:0 8px 0 0}
.vr-main{flex:1;min-width:0;display:flex;align-items:center;gap:20px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:12px 16px;border-radius:24px}
.vr-idx{font-family:var(--f-num);font-weight:300;font-size:40px;letter-spacing:-.04em;width:62px;font-variant-numeric:tabular-nums;color:var(--text-tertiary,var(--text-secondary))}
.vr-t{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em}.vr-a{display:block;font-size:14px;color:var(--text-secondary)}
.vr-d{font-family:var(--f-mono);font-size:14px;color:var(--text-secondary)}
.vrow.on{background:var(--vg);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}.vrow.on .vr-idx,.vrow.on .vr-t,.vrow.on .vr-a,.vrow.on .vr-d,.vrow.on .ib{color:#fff}
/* 드라이브 추천: 큰 순위 숫자 + 비비드 광택 */
.dsheen{position:absolute;inset:0;border-radius:50%;background:var(--vg);mix-blend-mode:soft-light;opacity:.9;pointer-events:none}
.dcirc::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 3px 2px rgba(255,255,255,.55),inset 0 -20px 40px rgba(0,0,0,.18);pointer-events:none}
.dnum{position:absolute;left:50%;top:9%;transform:translateX(-50%);font-family:var(--f-num);font-weight:300;font-size:120px;line-height:1;letter-spacing:-.06em;color:#fff;text-shadow:0 0 28px rgba(255,255,255,.55);z-index:1;pointer-events:none}
.rear .dnum{font-size:84px}
.rear .vbento{grid-template-columns:repeat(3,minmax(0,1fr))}.rear .vt-num{font-size:96px}.rear .vbento .wide .vt-num{font-size:120px}.rear .vt-num.big{font-size:170px}.rear .vh-name{font-size:30px}
#device.hasbar .vhero{padding-bottom:calc(var(--mbH) + 50px)}

/* 지금 재생 배경: 비비드 그라데이션 (곡마다 색이 다름), 천천히 흐름 */
.npfull .lp .amll{opacity:0}
.npvivid{position:absolute;inset:0;overflow:hidden;background:var(--vg);pointer-events:none}
.npvivid i{position:absolute;inset:-30%;background:radial-gradient(40% 35% at 30% 30%,rgba(255,255,255,.45),transparent 70%),radial-gradient(45% 40% at 75% 70%,rgba(255,255,255,.22),transparent 70%);mix-blend-mode:soft-light;animation:npdrift 18s ease-in-out infinite alternate;animation-play-state:paused}
.npfull.playing .npvivid i{animation-play-state:running}
@keyframes npdrift{0%{transform:translate(-6%,-4%) rotate(0deg) scale(1)}50%{transform:translate(5%,3%) rotate(12deg) scale(1.08)}100%{transform:translate(-3%,6%) rotate(-8deg) scale(1.02)}}
@media (prefers-reduced-motion:reduce){.npvivid i{animation:none}}
.npfull .lp .npveil{background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 30%,transparent 70%,rgba(0,0,0,.22))}

/* 녹음 중 표시 + 저장 애니메이션 */
#main .recording{outline:3px solid #F54D20;outline-offset:6px;border-radius:24px;animation:recglow 1.4s ease-in-out infinite}
@keyframes recglow{0%,100%{outline-color:rgba(245,77,32,1)}50%{outline-color:rgba(245,77,32,.35)}}
.recbadge{display:flex;align-items:center;gap:12px;align-self:flex-start;padding:10px 18px 10px 14px;border-radius:999px;background:#F54D20;color:#fff;font-weight:700;letter-spacing:.08em;font-size:18px}
.recbadge i{width:14px;height:14px;border-radius:50%;background:#fff;animation:recdot 1s steps(2,jump-none) infinite}
.recbadge .recmsg{font-weight:500;letter-spacing:0;font-size:15px;opacity:.9}
@keyframes recdot{50%{opacity:.2}}
.recbtn.on{background:#F54D20 !important;color:#fff !important;animation:recpulse 1.2s ease-in-out infinite}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(245,77,32,.55)}50%{box-shadow:0 0 0 14px rgba(245,77,32,0)}}
.lrow.justsaved{animation:savedIn .9s cubic-bezier(.2,.8,.2,1) both, savedGlow 2.4s ease-out both}
@keyframes savedIn{0%{transform:translateY(-24px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
@keyframes savedGlow{0%,30%{box-shadow:inset 0 0 0 2px var(--accent-primary),0 0 30px rgba(255,123,57,.45)}100%{box-shadow:inset 0 0 0 0 transparent,0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.recording,.recbtn.on,.lrow.justsaved,.recbadge i{animation:none}}

/* 놀이 타일: 홈 플레이리스트와 같은 비비드 그라데이션 + 큰 아이콘 */
.tilewrap .vplay{width:100%;aspect-ratio:auto;height:340px}
.vp-icon{position:relative;width:132px;height:132px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.14) 62%);box-shadow:inset 0 1px 1px rgba(255,255,255,.75)}
.vp-icon svg{width:64px;height:64px;color:#fff}
.rear .tilewrap .vplay{height:260px}.rear .vp-icon{width:96px;height:96px}.rear .vp-icon svg{width:46px;height:46px}
.chsw{display:inline-flex;align-items:center;gap:8px}.chsw i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
/* 패널을 벗긴 스크롤 영역: 그림자가 잘리지 않도록 양옆 여유 (정렬은 그대로) */
#main .panel.scroll{padding-left:28px!important;padding-right:28px!important;margin-left:-28px;margin-right:-28px;padding-top:12px;margin-top:-12px}

/* 소리 탭 안 mimo 목소리 고르기 */
.vsel{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);align-items:center;column-gap:22px;padding:6px 0}
.vsel-l{font-family:var(--f-mono);font-size:15px;letter-spacing:.06em;color:var(--text-secondary)}
.vsel-opts{display:flex;gap:12px;flex-wrap:wrap}
.vopt{display:flex;align-items:center;gap:2px;border-radius:999px;background:var(--bg-canvas);padding:4px 4px 4px 4px;box-shadow:inset 0 0 0 1px var(--border-subtle)}
.vopt.on{background:var(--text-primary)}.vopt.on .vopt-sel,.vopt.on .vopt-play{color:var(--bg-canvas)}
.vopt-sel{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--text-primary);font:inherit;font-size:17px;font-weight:500;padding:8px 6px 8px 16px;cursor:pointer}
.vopt-sel svg{width:18px;height:18px}
.vtry{padding-left:222px}.vtry .btn{background:var(--bg-canvas)!important;box-shadow:inset 0 0 0 1px var(--border-subtle)}
.slider.gray input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,#000,#fff);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.slider.gray input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:linear-gradient(90deg,#000,#fff)}
.slider.gray input[type=range]::-webkit-slider-thumb{margin-top:-11px}
.decostate{position:absolute;right:20px;top:16px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;color:#fff}.decostate .t-mono{font-size:12px;letter-spacing:.12em;opacity:.55}

/* 꾸미기 옆모습 미리 보기: 빛이 mimo 천을 통해 비치고, 누르면 반응 */
.ambmimo{position:absolute;left:50%;top:54%;width:360px;max-width:78%;transform:translate(-50%,-50%);border:0;padding:0;background:none;cursor:pointer;line-height:0;transform-origin:50% 100%}
.ambmimo img{width:100%;height:auto;display:block}
.ambbody{position:absolute;inset:0;-webkit-mask:url(mimo_side.svg) center/100% 100% no-repeat;mask:url(mimo_side.svg) center/100% 100% no-repeat;mix-blend-mode:hard-light;pointer-events:none}
.ambhint{position:absolute;left:16px;top:14px;color:rgba(255,255,255,.55);font-size:12px;letter-spacing:.12em}

/* 재생 버튼: 키컬러(주황 orange-500) 단색 — 그라데이션·그림자 없음 */
.mbplay,.ib.xl.filled[data-act="play"],.ib.accent[data-act="loopPlay"],.vbar .ib.xl.filled{
 background:var(--orange-500,#FF7B39) !important;background-image:none !important;
 color:#fff !important;border:0 !important;
 box-shadow:none !important}
.mbplay svg,.ib.xl.filled[data-act="play"] svg,.ib.accent[data-act="loopPlay"] svg,.vbar .ib.xl.filled svg{filter:none}

/* 꾸미기 미리 보기 하나로: 옆모습 프레임이 패널을 꽉 채우고, 윗면에 디스플레이 애니메이션 */
.decoprev{padding:0 !important;overflow:hidden}
.decoprev .decoside{flex:1;min-height:0;height:100%;border-radius:inherit}
.decoprev .ambmimo{width:72%;max-width:none;top:52%}
.ambdisc{position:absolute;left:50%;top:44%;width:100%;height:auto;aspect-ratio:1;transform:translate(-50%,-50%) scaleY(.42);pointer-events:none;mix-blend-mode:screen}

/* 최근 들은 곡: 커버 + 제목 가로 타일 */
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.rear .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.rrow{position:relative;display:flex;align-items:center;gap:20px;height:104px;border:0;border-radius:12px;overflow:hidden;padding:0 20px 0 0;background:var(--bg-surface);color:var(--text-primary);font:inherit;text-align:left;cursor:pointer}
.rrow.on{background:color-mix(in srgb,var(--accent-primary) 16%,var(--bg-surface))}
.rart{position:relative;flex:0 0 auto;width:104px;height:104px;background-size:cover;background-position:center;overflow:hidden}
.rt{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 내 플레이리스트: 드라이브 추천 큰 원보다 4px 작은 정사각 타일 */
.vbento{display:flex;flex-wrap:wrap;gap:18px}
.vbento .vtile{width:calc(var(--D,300px) - 4px);height:calc(var(--D,300px) - 4px);aspect-ratio:auto;flex:none}
.vbento .vtile.wide{width:calc((var(--D,300px) - 4px) * 2 + 18px)}
#homeMusic{--D:300px}.rear #homeMusic{--D:220px}
.vbento .vt-num{font-size:120px}.vbento .wide .vt-num{font-size:150px}.vt-plus{width:96px;height:96px}
.rear .vbento .vt-num{font-size:84px}
/* 호버: 프레임은 그대로, 안의 콘텐츠만 살짝 확대 (전체 통일) */
.zb::before,.dcirc::before,.card .cov::before{content:"";position:absolute;inset:0;background:inherit;background-size:cover;background-position:center;border-radius:inherit;transition:transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.dcirc,.card .cov,.zb{isolation:isolate}
.dcirc:hover::before,.card:hover .cov::before,.rrow:hover .zb::before{transform:scale(1.07)}
.apptile img,.apptile svg,.vtile > *,.decotile .hw,.vplay .vp-icon,.newcard > *{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.app:hover .apptile img,.app:hover .apptile svg,.vtile:hover > *:not(.vt-foot),.decotile:hover .hw,.newcard:hover > *{transform:scale(1.06)}
.vtile:hover > .vt-foot{transform:scale(1.02);transform-origin:0 100%}
.apptile,.vtile,.decotile,.newcard,.rrow{overflow:hidden}
@media (prefers-reduced-motion:reduce){.zb::before,.dcirc::before,.card .cov::before,.apptile img,.apptile svg,.vtile > *{transition:none}}

/* 위쪽 유리 머리 */
#main.glasshead{position:relative}
#main.glasshead > *:not(.scroll):not(.topglass){position:relative;z-index:3}
#main.glasshead > .scroll{position:relative;z-index:1}
.topglass{position:absolute;left:-14px;right:calc(-1 * var(--bleed,60px));z-index:2;pointer-events:none;opacity:0;transition:opacity .2s;
 background:color-mix(in srgb,var(--bg-canvas) 62%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6)}

/* Spotify 웹 같은 섹션 간격·머리 */
.hsec{display:grid;gap:16px}
.shx{display:flex;align-items:center;gap:20px}
.shx-ey{font-size:18px;font-weight:400;color:var(--text-secondary);line-height:1.3;margin-bottom:2px}
.shx-t{margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15;color:var(--text-primary)}
.rear .shx-t{font-size:26px}.rear .shx-ey{font-size:15px}
.rgrid{gap:16px}.apps{gap:24px}.vbento{gap:24px}
.vrow.add .vr-main{padding-left:14px}.vrow.add .vr-t{font-size:20px}.ib.vadd{background:var(--vg,linear-gradient(135deg,#ff8a3d,#ff5a1f));color:#fff;border:0;border-radius:999px;box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
/* mimo 부르기: 테두리·유리 판 없이 mimo만 */
.mbmimo{background:none !important;border:0 !important;box-shadow:none !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;border-radius:0 !important}
.mbmimo .hw{width:96% !important;filter:drop-shadow(0 8px 14px rgba(0,0,0,.18))}

/* ── 색 쓰는 규칙 (Spotify 방식) ──────────────────────────────
   키컬러(orange/500)는 '지금 일어나는 일'에만: 재생 버튼, 지금 재생 중인 곡, 켜진 스위치·모드, 끌고 있는 진행 바.
   '고른 것'(칩·탭·세그먼트·내비)은 무채색 반전(진한 회색 ↔ 흰색)으로, 나머지는 전부 회색 단계로. */
:root{--sel-bg:#2E2E2E;--sel-ink:#FFFDFC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sel-bg:#FFFDFC;--sel-ink:#1A1A1A}}
:root[data-theme="dark"]{--sel-bg:#FFFDFC;--sel-ink:#1A1A1A}
:focus-visible{outline-color:var(--text-primary)}
.dcirc:focus-visible{outline-color:var(--text-primary)}
/* 내비: 선택돼도 주황 판 없이, 회색 판 + 진한 글자 */
.nav[aria-current="page"]{background:var(--bg-surface-2);color:var(--text-primary)}
/* 칩: 안 고른 건 회색 판, 고른 건 반전 */
.chip{background:var(--bg-surface-2);box-shadow:none;color:var(--text-primary)}
.chip:hover{background:var(--bg-surface-3)}
.chip[aria-pressed="true"],.seg2 button[aria-pressed="true"],.ez[aria-pressed="true"],.chfull .pill[aria-pressed="true"],.tgtag.me{background:var(--sel-bg) !important;color:var(--sel-ink) !important;box-shadow:none !important;border-color:transparent !important}
.ez[aria-pressed="true"] .ezi{background:var(--sel-ink);color:var(--sel-bg)}
/* 슬라이더·진행 바: 평소엔 무채색, 만지는 동안만 주황 */
.slider input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--text-primary) var(--p),var(--border-strong) var(--p))}
.slider input[type=range]::-moz-range-track{background:linear-gradient(to right,var(--text-primary) var(--p),var(--border-strong) var(--p))}
.slider:not(.hue):not(.gray) input[type=range]:hover::-webkit-slider-runnable-track,.slider:not(.hue):not(.gray) input[type=range]:active::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--accent-primary) var(--p),var(--border-strong) var(--p))}
.slider:not(.hue):not(.gray) input[type=range]:hover::-moz-range-track,.slider:not(.hue):not(.gray) input[type=range]:active::-moz-range-track{background:linear-gradient(to right,var(--accent-primary) var(--p),var(--border-strong) var(--p))}
.mbtrack i{background:var(--text-primary);transition:background .15s}
.mbtrack b{background:var(--text-primary);box-shadow:0 2px 6px rgba(0,0,0,.25);opacity:0;transition:opacity .15s,transform .15s}
.mbtrack:hover i,.mbar.scrub .mbtrack i{background:var(--accent-primary)}
.mbtrack:hover b,.mbar.scrub .mbtrack b{opacity:1}
.progress i,.meters b i{background:var(--text-primary)}
/* 고른 항목 테두리·글자 표시도 무채색 */
.photo[aria-pressed="true"],.tgseat[aria-pressed="true"]{box-shadow:0 0 0 3px var(--text-primary)}
.photo[aria-pressed="true"]::after{background:var(--text-primary);color:var(--bg-canvas)}
.skcard[aria-current="true"],.plpick .lrow[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--text-primary)}
.tkin input:focus{box-shadow:inset 0 0 0 2px var(--text-primary)}
.tkmsg.me .tkbub{background:var(--sel-bg);color:var(--sel-ink)}
.toast button,.tgtoast button{color:var(--text-primary);text-decoration:underline;text-underline-offset:3px}
.dzinfo .t-mono,.cmstate{color:var(--text-secondary)}
.bpm{color:var(--text-primary)}
.btn.danger{color:var(--text-primary)}
/* 최근 재생: 재생 중인 칸은 회색 판 + 제목만 주황 */
.rrow.on{background:var(--bg-surface-2)}
.rrow.on .rt{color:var(--accent-primary)}
/* 재생 목록: 지금 재생 중인 곡은 판을 칠하지 않고 제목만 주황 */
.vrow.on{background:var(--bg-surface-2);box-shadow:none}
.vrow.on .vr-t{color:var(--accent-primary)}
.vrow.on .vr-idx,.vrow.on .vr-d,.vrow.on .ib{color:var(--text-secondary)}.vrow.on .vr-a{color:var(--text-secondary)}
.ambdisc{mix-blend-mode:normal !important}
/* mimo 말풍선: 음악 바와 같은 반투명 유리 + 말 끝나고 천천히 사라짐 */
.subtitle,.subtitle.atcorner{background:linear-gradient(135deg,color-mix(in srgb,var(--bg-surface) 70%,transparent),color-mix(in srgb,var(--bg-surface) 38%,transparent));-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);
 border:1px solid color-mix(in srgb,var(--text-primary) 10%,transparent);box-shadow:0 18px 50px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.06),inset 0 1px 0 color-mix(in srgb,#fff 30%,transparent);color:var(--text-primary);
 transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1),width .35s}
.subtitle.on{transition:opacity .25s,transform .25s,width .35s}
.subtitle::before,.subtitle.atcorner::before{display:none}

/* ══ 스위스 플랫 (레퍼런스: 배터리 앱 · Sold Services · neutone) ══════════════════════
   판 구분은 1px 선 · 네모는 모서리 0, 큰 면 · 버튼만 둥글게 · 유리/반투명/그림자 없음 ·
   제목은 굵게, 작은 라벨과 큰 제목의 크기 차이 크게 · 음량은 1px 선 + 납작한 원 */
#device{--line:color-mix(in srgb,var(--text-primary) 16%,transparent);
  --radius-xs:0px;--radius-sm:0px;--radius-md:0px;--radius-lg:0px;--radius-xl:0px;--bleed:32px;
  background:var(--bg-canvas) !important;gap:0 !important;padding:0 !important}
#device.rear{--bleed:20px}
*{-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
/* 프레임: 메뉴와 콘텐츠를 선 하나로 나눔 */
.rail{background:var(--bg-canvas);border-radius:0;border-right:1px solid var(--line);padding:24px 0;align-self:stretch;width:128px}
#main{background:var(--bg-canvas);border-radius:0;padding:24px 36px 0 36px;overflow:hidden;overflow:clip;align-self:stretch;min-height:0}
#device.rear #main{padding:14px 22px 0 20px}
#device.hasbar #main,#device.rear.hasbar #main{margin-bottom:0}
.nav{border-radius:999px !important}
.nav[aria-current="page"]{background:var(--text-primary) !important;color:var(--bg-canvas) !important}
.status{border-bottom:1px solid var(--line);margin:0 -36px;padding:0 36px}
/* 판(패널): 칠한 회색 판 대신 1px 선 */
.panel{background:transparent !important;border:1px solid var(--line);border-radius:0 !important;box-shadow:none !important}
#main .panel.scroll,#main .panel:has(> .scroll),#main .panel:has(> div > .scroll){border:0}
/* 네모: 모서리 0, 면으로 */
.vtile,.vhero,.vrow,.rrow,.rart,.tkbub,.hk .lg,.decotile,.decoside,#ambPrev,.card .cov,.newcard,.apptile,.apptile.sm,.awhero,.appwin,.np-main,.np-cover,.tile,.dialog,.sheet,.vsheet,.volpop,.tkright,.mbart,.art,.qart,.plthumb,.photo{border-radius:0 !important}
.vrow .art,.vrow.add .art,.rrow .rart{border-radius:0 !important}
/* 그림자 없음 */
.apptile,.vtile,.dcirc,.card .cov,.rrow,.mbart,.dialog,.sheet,.vsheet,.volpop,.appwin,.decotile,.tile,.np-cover,.vrow.on,.chip,.btn,.ib,.mbmimo,.vglass,.vpill,.dnum,.dhot,.newcard{box-shadow:none !important}
.mbmimo .hw{filter:none !important}
.mbplay,.ib.xl.filled[data-act="play"],.ib.accent[data-act="loopPlay"],.vbar .ib.xl.filled{box-shadow:none !important}
/* 음악 바: 유리 → 흰 면 + 위쪽 1px 선, 진행 바는 1px */
.mbar{background:var(--bg-canvas) !important;border:0 !important;border-top:1px solid var(--line) !important;border-radius:0 !important;box-shadow:none !important;bottom:0 !important;padding:0 24px 0 0 !important}
#device .mbar{height:calc(var(--mbH) + 10px)}
.mbart{width:calc(var(--mbH) + 10px) !important;height:calc(var(--mbH) + 10px) !important}
.mbar.playing .mbart img{animation:none}
.mbtrack::before{height:1px;margin-top:0;background:var(--line);border-radius:0}
.mbtrack i{height:1px;margin-top:0;border-radius:0}
.mbtrack b{width:14px;height:14px;margin:-7px 0 0 -7px}
.mbmimo{bottom:0 !important}
/* 말풍선·상단 머리: 반투명 대신 꽉 찬 면 */
.subtitle,.subtitle.atcorner{background:var(--bg-inverse) !important;color:var(--text-inverse) !important;border:0 !important;box-shadow:none !important}
.topglass{background:var(--bg-canvas) !important;border-bottom:1px solid var(--line)}
.vglass{background:transparent !important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.85) !important}
.vpill{background:#1A1A1A !important;color:#fff !important}
.dhot{background:#1A1A1A !important}
/* 음량·조절: 아주 얇은 선 + 납작한 원 손잡이 */
.slider input[type=range]::-webkit-slider-runnable-track,
.glowgrp:not(.volpop) .slider:not(.hue) input[type=range]::-webkit-slider-runnable-track,
.volpop .slider input[type=range]::-webkit-slider-runnable-track{height:1px !important;border-radius:0;background:linear-gradient(to right,var(--text-primary) var(--p),var(--line) var(--p)) !important}
.slider input[type=range]::-moz-range-track{height:1px;background:var(--line)}
.slider input[type=range]::-webkit-slider-thumb,
.glowgrp:not(.volpop) .slider:not(.hue) input[type=range]::-webkit-slider-thumb,
.volpop .slider input[type=range]::-webkit-slider-thumb{width:22px !important;height:22px !important;margin-top:-10.5px !important;border:0 !important;border-radius:50%;background:var(--text-primary) !important;box-shadow:none !important}
.slider.hue input[type=range]::-webkit-slider-runnable-track,.slider.gray input[type=range]::-webkit-slider-runnable-track{height:4px !important;border-radius:0 !important;box-shadow:none !important}
.slider.hue input[type=range]::-webkit-slider-thumb,.slider.gray input[type=range]::-webkit-slider-thumb{margin-top:-9px !important}
/* 글자: 제목은 굵게, 작은 라벨 ↔ 큰 제목 대비 크게 */
.t-title-xl,.t-title,.vh-name,.vt-name,.sh .t-title{font-weight:700 !important;letter-spacing:-.03em}
.mbmimo{border-top:1px solid var(--line) !important;border-left:1px solid var(--line) !important;background:var(--bg-canvas) !important;border-radius:0 !important}
.mbmimo .hw{width:62% !important}
.rail .nav{width:84px;height:84px;border-radius:50% !important}
.rear .rail .nav{width:72px;height:72px}
/* 칩: 칠한 판 대신 1px 선, 고른 칩만 꽉 찬 반전 */
.chip{background:transparent !important;box-shadow:inset 0 0 0 1px var(--line) !important;color:var(--text-primary)}
.chip:hover{box-shadow:inset 0 0 0 1px var(--text-primary) !important}
.chip[aria-pressed="true"]{box-shadow:none !important}
/* 제목은 어느 화면이든 굵게 */
#main .t-title-xl,#main .pad .t-title-xl{font-family:var(--f-title) !important;font-weight:700 !important}
/* 목록: 줄마다 1px 선, 재생 중 줄도 면 칠 없이 제목만 주황 */
.vlist .vrow{border-bottom:1px solid var(--line)}
.vrow.on{background:transparent !important}
/* 새 플레이리스트 +: 빛나는 구슬 대신 1px 원 */
.vt-plus{background:transparent !important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9) !important}
/* 글꼴 (앱에 같이 넣음): 영어 제목 Helvetica 83 Extended Heavy · 한국어 제목 Gmarket Sans Bold · 본문 Noto Sans KR */
@font-face{font-family:"MimoEN";font-weight:400 900;font-display:swap;src:url("fonts/helvetica-ext-heavy.woff2") format("woff2")}
@font-face{font-family:"MimoKR";font-weight:400 900;font-display:swap;src:url("fonts/gmarket-sans-bold.woff2") format("woff2")}
/* Pretendard Variable — Copyright (c) 2021 Kil Hyung-jin, SIL Open Font License 1.1 (github.com/orioncactus/pretendard) */
@font-face{font-family:"MimoBody";font-weight:45 920;font-style:normal;font-display:swap;src:url("fonts/pretendard-variable.woff2") format("woff2-variations"),url("fonts/pretendard-variable.woff2") format("woff2")}
:root,#device{--f-title:"MimoEN","MimoKR","MimoBody",system-ui,sans-serif;--f-body:"DM Sans","MimoBody",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
#device{font-family:var(--f-body)}
#device .t-title-xl,#device .t-title,#device .shx-t,#device .vh-name,#device .vt-name,#device .np-title,#device .sktitle,#device .sh .t-title{font-family:var(--f-title) !important;font-weight:700 !important;letter-spacing:-.02em}
/* Spotify식 카드: 커버 정사각 + 아래 제목·설명 */
.mgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px}
.rear .mgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.mcard{border:0;background:none;padding:0;margin:0;text-align:left;display:grid;gap:6px;cursor:pointer;color:var(--text-primary);font:inherit;min-width:0}
.mcov{position:relative;display:block;aspect-ratio:1;overflow:hidden;background-size:cover;background-position:center}
.mcov::before{content:"";position:absolute;inset:0;background:inherit;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.mcard:hover .mcov::before{transform:scale(1.06)}
.mcov.mnew{display:grid;place-items:center;border:1px solid var(--line);color:var(--text-secondary)}.mcov.mnew::before{display:none}.mcov.mnew svg{width:44px;height:44px}
.mcard .mc-t{font-size:18px;font-weight:700;margin-top:6px;display:block}
.mcard .mc-s{font-size:14px;color:var(--text-secondary);display:block}
.plhero{display:grid;align-content:start;gap:20px;padding-bottom:calc(var(--mbH) + 40px);overflow:auto;scrollbar-width:none}
.plcov{aspect-ratio:1;background-size:cover;background-position:center}
.plhero .vh-name{color:var(--text-primary)}
/* 눌리는 네모: 크기에 따라 radius 16 · 24 · 32 (짧은 변 기준 ~120px → 16, ~260px → 24, 그 이상 → 32) */
#device{--r-s:8px;--r-m:8px;--r-l:16px}   /* 눌리는 네모: 기본 8, 큰 것(커버·큰 타일·좌석 카드) 16 */
/* 16: 작은 칸·줄 */
#device .cell,#device .ez,#device .tgbtn,#device .rrow,#device .vrow,#device .rec,#device .accbtn,#device .skcard,#device .photo,#device .mbart{border-radius:var(--r-s) !important;overflow:hidden}
/* 24: 중간 타일 */
#device .apptile,#device .apptile.sm,#device .decotile,#device .card .cov,#device .newcard,#device .svccard{border-radius:var(--r-m) !important;overflow:hidden}
/* 32: 큰 커버·타일 */
#device .mcov,#device .plcov,#device .vtile,#device .vplay,#device .tgseat,#device .tile{border-radius:var(--r-l) !important;overflow:hidden}
#device.rear .mcov,#device.rear .vtile,#device.rear .tgseat{border-radius:var(--r-m) !important}
#device .ezdir .ez{border-radius:var(--r-m) !important}
#device .mcov::before,#device .card .cov::before{border-radius:inherit}
/* 벅스 차트 목록 */
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px}
.rear .cgrid{grid-template-columns:1fr}
.crow{display:flex;align-items:center;gap:18px;width:100%;min-width:0;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 8px;cursor:pointer;color:var(--text-primary);font:inherit;text-align:left;border-radius:0}
.crow:hover{background:var(--bg-surface)}
.cr-n{width:40px;flex:none;font-family:var(--f-title);font-weight:900;font-size:24px;text-align:center}
.cr-art{width:64px;height:64px;flex:none;border-radius:8px;background-size:cover;background-position:center}
.cr-txt{display:grid;min-width:0;flex:1}

#device:not(.hasbar) .lspanel.fireframe{margin-bottom:calc(var(--mbH,92px) + 9px)}
/* 라이트 쇼·모닥불: 디스플레이 애니메이션은 위에서 본 몸통 그림에 직접 그림 (꾸미기와 같은 모습) */
.lsdisc .hw canvas.disc,.firedisc .hw canvas.disc{visibility:hidden}
/* ---------- 작은 화면: 뒷좌석 265×168 · 대시보드 125×78 ---------- */
#device.mini{padding:0 !important;gap:0 !important;border-radius:10px !important;overflow:hidden}
#device.mini.mini-dash{border-radius:6px !important}
#device.mini > :not(#miniView):not(#layer){display:none !important}
#miniView{position:relative;width:100%;height:100%;box-sizing:border-box;background:var(--bg-canvas);color:var(--text-primary);font-family:var(--f-body);overflow:hidden}
#miniView button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#miniView .i{width:100%;height:100%}
.mini-seat #miniView{padding:9px 11px 10px;display:flex;flex-direction:column;gap:7px}
.mv-top{display:flex;align-items:center;justify-content:space-between;font-size:9px;line-height:1;position:relative;z-index:1}
.mv-tabs{display:flex;gap:4px}
.mvtab{font-size:8.5px !important;padding:3px 7px !important;border-radius:99px;border:1px solid var(--line) !important;color:var(--text-secondary) !important}
.mvtab[aria-pressed="true"]{background:var(--text-primary) !important;border-color:var(--text-primary) !important;color:var(--bg-canvas) !important}
.mv-body{flex:1;min-height:0;display:flex;gap:10px;align-items:stretch;position:relative;z-index:1}
.mv-art{width:104px;flex:none;border-radius:6px;background:center/cover no-repeat var(--line)}
.mv-mimo{background:none;display:grid;place-items:center}
.mv-mimo canvas,.mv-dmimo canvas{width:118%;height:auto;aspect-ratio:1;margin:-9%}
.mv-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.mv-t{font-size:12.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-a{font-size:9px;line-height:1.2;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-bar{height:2px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:7px}
.mv-bar i{display:block;height:100%;width:0;background:var(--text-primary)}
.mv-time{display:flex;justify-content:space-between;font-size:7.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums;margin-top:2px}
.mv-ctl{display:flex;align-items:center;gap:12px;margin-top:4px}
.mvb{width:14px;height:14px;display:grid;place-items:center}
.mvb.mvplay{width:28px;height:28px;border-radius:50%;background:#FF7B39 !important;color:#fff !important;padding:7px !important;box-sizing:border-box}
.mvcall{position:absolute;right:8px;bottom:7px;width:26px;height:26px;z-index:2}
.mvcall .mcall{width:100%;height:100%}
.mv-lsbg{position:absolute;inset:0;z-index:0;pointer-events:none;transition:background .4s ease}
/* 대시보드 */
.mini-dash #miniView{padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between}
.mv-dash{display:flex;align-items:center;gap:6px;min-width:0}
.mv-dmimo{width:34px;height:34px;flex:none;display:grid;place-items:center}
.mv-dinfo{min-width:0;flex:1}
.mini-dash .mv-t{font-size:10px}
.mini-dash .mv-a{font-size:7.5px}
.mv-drow{display:flex;align-items:center;gap:6px}
.mv-drow .mv-bar{flex:1;margin:0}
.mini-dash .mvb.mvplay{width:20px;height:20px;padding:5px !important}
.mini-dash .mvcall{position:static;width:18px;height:18px}
.mv-clock{font-size:10px;font-weight:500;font-variant-numeric:tabular-nums}
/* 앱 모드 (아이패드 홈 화면에서 열었을 때): 미리보기 도구·틀 없이 화면 꽉 채움 */
html.appmode,html.appmode body{height:100%;overflow:hidden;overscroll-behavior:none}
html.appmode body{padding:0 !important;margin:0;background:var(--bg-canvas,#fff)}
html.appmode .tools{display:none !important}
html.appmode #stageWrap{max-width:none;margin:0;width:100%;height:100vh;height:100dvh}
html.appmode #scaler{border-radius:0 !important;margin:0 !important}
html.appmode #device{border-radius:0 !important}
